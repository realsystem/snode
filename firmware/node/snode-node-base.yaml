# SNODE node firmware v0.2 (ESPHome), shared by every node. Design: docs/08-node-design.md
# Board: Seeed XIAO ESP32C3. Power is switched by the RV-3028 RTC alarm; the node is unpowered between reports.
# Probes: powered bus O2, protocol v1 (docs/10-bus-protocol.md), one UART per row bus.
# Each node file sets the substitutions below, the two snode_bus slot lists, and includes this file
# (see snode_f_01.yaml).  Substitutions: node_name, grove_code (F/B/S), node_num, receiver_mac
# Status: written without compiling. UNVERIFIED until the first compile and bench tests T2/T3/T4b.

esphome:
  name: ${node_name}
  on_boot:
    - priority: -100
      then:
        - script.execute: main_cycle

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO          # USB serial; visible only when a laptop is connected
  hardware_uart: USB_SERIAL_JTAG   # keeps both hardware UARTs free for the buses

external_components:
  - source:
      type: local
      path: ../components
    components: [rv3028, snode_bus]

i2c:
  sda: GPIO6           # XIAO D4
  scl: GPIO7           # XIAO D5
  frequency: 100kHz
  scan: false

time:
  - platform: rv3028   # 0x52
    id: rtc
    timezone: UTC      # node works in UTC; the receiver turns local report times into UTC
    update_interval: never

uart:                  # one UART per row bus, 9600 8N1 (docs/10-bus-protocol.md)
  - id: uart_a
    tx_pin: GPIO21       # XIAO D6 -> TX_A (mark/space driver)
    rx_pin:
      number: GPIO2      # XIAO D0 <- comparator A; strapping pin, held high at boot by the comparator
      ignore_strapping_warning: true
    baud_rate: 9600
  - id: uart_b
    tx_pin: GPIO20       # XIAO D7 -> TX_B
    rx_pin:
      number: GPIO8      # XIAO D8 <- comparator B; strapping pin, held high at boot by the comparator
      ignore_strapping_warning: true
    baud_rate: 9600

one_wire:
  - platform: gpio       # node DS18B20 only (one sensor, short cable)
    pin: GPIO10          # XIAO D10, 4.7 kOhm pull-up to 3V3

switch:
  - platform: gpio     # HOLD: keeps the load switch on after the alarm flag is cleared
    id: hold
    pin: GPIO4         # XIAO D2 -> N-MOSFET gate, pulls the TPS22917L ON pin low
    restore_mode: ALWAYS_ON
    internal: true

output:
  - platform: gpio     # BUS_EN: powers both row buses (probes measure at power-up)
    id: bus_en
    pin: GPIO5         # XIAO D3 -> N-FET -> P-FET Q_EN

deep_sleep:            # fallback only: used if power was not cut after HOLD was released
  id: ds_fallback
  sleep_duration: 1h

espnow:
  id: en
  auto_add_peer: false
  peers:
    - ${receiver_mac}
  on_broadcast:
    - lambda: |-
        // Receiver reply (packet format v1, docs/08-node-design.md):
        // [0]=0x81 [1]=grove [2]=node_num [3..6]=UTC now [7..10]=next wake (UTC)
        if (size < 11 || data[0] != 0x81) return;
        if (data[1] != '${grove_code}' || data[2] != ${node_num}) return;
        id(reply_now) = (uint32_t) data[3] | ((uint32_t) data[4] << 8) | ((uint32_t) data[5] << 16) | ((uint32_t) data[6] << 24);
        id(reply_next) = (uint32_t) data[7] | ((uint32_t) data[8] << 8) | ((uint32_t) data[9] << 16) | ((uint32_t) data[10] << 24);
        id(reply_ms) = millis();
        id(reply_ok) = true;

globals:
  - id: seq
    type: uint16_t
    restore_value: true
    initial_value: '0'
  - id: cur_ch            # last channel that worked (channel follow, D31)
    type: uint8_t
    restore_value: true
    initial_value: '1'
  - id: last_next         # last scheduled wake (UTC epoch)
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: backlog           # up to 4 unsent packets x 64 bytes
    type: std::array<uint8_t, 256>
    restore_value: true
    initial_value: '{}'
  - id: backlog_n
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: pkt
    type: std::array<uint8_t, 64>
    initial_value: '{}'
  - id: pkt_len
    type: uint8_t
    initial_value: '0'
  - id: wake_reason       # 0 = power-on, 1 = RTC alarm, 2 = button
    type: uint8_t
    initial_value: '0'
  - id: send_ok
    type: bool
    initial_value: 'false'
  - id: attempt
    type: uint8_t
    initial_value: '0'
  - id: try_ch
    type: uint8_t
    initial_value: '1'
  - id: reply_ok
    type: bool
    initial_value: 'false'
  - id: reply_now
    type: uint32_t
    initial_value: '0'
  - id: reply_next
    type: uint32_t
    initial_value: '0'
  - id: reply_ms
    type: uint32_t
    initial_value: '0'
  - id: bl_fail
    type: uint8_t
    initial_value: '0'

sensor:
  - platform: adc        # pack voltage on the switched rail: 100k / 68k divider (no drain when off)
    id: vbat
    pin: GPIO3           # XIAO D1 (A1), ADC1
    attenuation: 12db
    filters:
      - multiply: 2.4706 # (100k + 68k) / 68k
    update_interval: never
  - platform: dallas_temp  # node DS18B20 at probe depth (frozen flag, temperature correction)
    id: soil_t             # only device on its bus, so no address needed
    resolution: 12
    update_interval: never

script:
  - id: main_cycle
    mode: single
    then:
      - lambda: |-
          if (id(rtc).alarm_fired_at_boot()) id(wake_reason) = 1;
          else if (id(rtc).power_on_reset_at_boot()) id(wake_reason) = 0;
          else id(wake_reason) = 2;   // no alarm, no reset: the button woke the node
          if (id(cur_ch) < 1 || id(cur_ch) > 11) id(cur_ch) = 1;
          id(en).set_channel_from_action(id(cur_ch));   // works because Wi-Fi is not used
          ESP_LOGI("snode", "wake reason %u, channel %u, backlog %u", id(wake_reason), id(cur_ch), id(backlog_n));
      - script.execute: watchdog
      - script.execute: measure
      - script.wait: measure
      - script.execute: build_packet
      - script.execute: send_follow
      - script.wait: send_follow
      - if:
          condition:
            lambda: 'return id(send_ok);'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(reply_ok);'
                timeout: 300ms
            - script.execute: send_backlog
            - script.wait: send_backlog
          else:
            - script.execute: store_backlog
      - if:                       # install mode after a button wake
          condition:
            lambda: 'return id(wake_reason) == 2;'
          then:
            - script.execute: discover        # list the probe serials found on each bus
            - script.wait: discover
            - script.execute:
                id: build_install
                bus: 0
            - script.wait: build_install
            - script.execute: send_follow
            - script.wait: send_follow
            - script.execute:
                id: build_install
                bus: 1
            - script.wait: build_install
            - script.execute: send_follow
            - script.wait: send_follow
            - repeat:                       # then a report every 10 s for 2 min
                count: 12
                then:
                  - delay: 10s
                  - script.execute: measure
                  - script.wait: measure
                  - script.execute: build_packet
                  - script.execute: send_follow
                  - script.wait: send_follow
      - script.execute: shutdown

  - id: watchdog                # never stay awake longer than this
    mode: single
    then:
      - delay: !lambda 'return id(wake_reason) == 2 ? 180000 : 25000;'
      - logger.log: "watchdog: forcing shutdown"
      - script.stop: main_cycle
      - script.execute: shutdown

  - id: measure
    mode: single
    then:
      - output.turn_on: bus_en       # probes boot and measure at power-up (docs/09-probe-design.md)
      - component.update: soil_t      # DS18B20 conversion runs in parallel (up to 750 ms)
      - delay: 150ms
      - lambda: 'id(bus_a).start_read(); id(bus_b).start_read();'
      - wait_until:
          condition:
            lambda: 'return id(bus_a).done() && id(bus_b).done();'
          timeout: 2s
      - output.turn_off: bus_en
      - component.update: vbat
      - delay: 650ms                  # rest of the DS18B20 conversion time

  - id: discover                    # install mode: find probe serials on both buses
    mode: single
    then:
      - output.turn_on: bus_en
      - delay: 150ms
      - lambda: 'id(bus_a).start_discover(); id(bus_b).start_discover();'
      - wait_until:
          condition:
            lambda: 'return id(bus_a).done() && id(bus_b).done();'
          timeout: 60s
      - output.turn_off: bus_en

  - id: build_install                 # install packet: one per bus (docs/08-node-design.md, section 6)
    mode: queued
    parameters:
      bus: int                        # 0 = row A, 1 = row B
    then:
      - lambda: |-
          auto &f = (bus == 0) ? id(bus_a).found() : id(bus_b).found();
          auto &p = id(pkt);
          p.fill(0);
          uint8_t n = f.size() > 10 ? 10 : (uint8_t) f.size();
          p[0] = 0x02; p[1] = 1; p[2] = '${grove_code}'; p[3] = ${node_num};
          p[4] = (bus == 0) ? 'A' : 'B';
          p[5] = n | (f.size() > 10 ? 0x80 : 0);   // bit 7: more than 10 found
          for (uint8_t i = 0; i < n; i++)
            for (int k = 0; k < 4; k++) p[6 + 4 * i + k] = (f[i] >> (8 * k)) & 0xFF;
          id(pkt_len) = 6 + 4 * n;

  - id: build_packet
    mode: single
    then:
      - lambda: |-
          // Report packet v1, little-endian (docs/08-node-design.md):
          // 0 type 0x01 | 1 version | 2 grove | 3 node_num | 4-5 seq | 6-9 RTC UTC (0 = invalid)
          // 10 flags (b0 time invalid, b1 backlog, b2 install mode) | 11 channel | 12-13 battery mV
          // 14-15 soil temp x100 (0x7FFF = missing) | 16 probe count | 17.. raw int16 per slot (0x7FFF = missing)
          auto &p = id(pkt);
          p.fill(0);
          p[0] = 0x01; p[1] = 1; p[2] = '${grove_code}'; p[3] = ${node_num};
          uint16_t s = ++id(seq);
          p[4] = s & 0xFF; p[5] = s >> 8;
          bool tv = id(rtc).time_valid();
          uint32_t t = tv ? id(rtc).read_epoch() : 0;
          for (int i = 0; i < 4; i++) p[6 + i] = (t >> (8 * i)) & 0xFF;
          uint8_t flags = 0;
          if (!tv) flags |= 0x01;
          if (id(wake_reason) == 2) flags |= 0x04;
          p[10] = flags;
          p[11] = id(cur_ch);
          float v = id(vbat).state;
          uint16_t mv = std::isnan(v) ? 0 : (uint16_t) lroundf(v * 1000.0f);
          p[12] = mv & 0xFF; p[13] = mv >> 8;
          float st = id(soil_t).state;
          int16_t sti = std::isnan(st) ? 0x7FFF : (int16_t) lroundf(st * 100.0f);
          p[14] = sti & 0xFF; p[15] = (sti >> 8) & 0xFF;
          p[16] = 20;
          for (int i = 0; i < 20; i++) {
            int16_t r = (i < 10) ? id(bus_a).raw(i) : id(bus_b).raw(i - 10);   // 0x7FFF = missing
            p[17 + 2 * i] = r & 0xFF; p[18 + 2 * i] = (r >> 8) & 0xFF;
          }
          id(pkt_len) = 17 + 40;

  - id: send_follow             # 3 tries on the saved channel, then channels 1..11 once each (D31)
    mode: single
    then:
      - lambda: 'id(send_ok) = false; id(attempt) = 0;'
      - while:
          condition:
            lambda: 'return !id(send_ok) && id(attempt) < 13;'
          then:
            - lambda: |-
                uint8_t ch;
                if (id(attempt) < 3) {
                  ch = id(cur_ch);
                } else {
                  ch = id(attempt) - 2;          // 1..10
                  if (ch >= id(cur_ch)) ch++;    // skip the saved channel: 1..11
                }
                id(try_ch) = ch;
                id(en).set_channel_from_action(ch);
                if (id(pkt)[0] == 0x01) id(pkt)[11] = ch;   // report packets carry the channel
            - espnow.send:
                address: ${receiver_mac}
                data: !lambda 'return std::vector<uint8_t>(id(pkt).begin(), id(pkt).begin() + id(pkt_len));'
                wait_for_sent: true
                continue_on_error: true
                on_sent:
                  - lambda: 'id(send_ok) = true;'
            - lambda: 'id(attempt) += 1;'
      - lambda: |-
          if (id(send_ok) && id(try_ch) != id(cur_ch)) {
            ESP_LOGI("snode", "channel follow: %u -> %u", id(cur_ch), id(try_ch));
            id(cur_ch) = id(try_ch);
          }
          if (!id(send_ok)) ESP_LOGW("snode", "no acknowledgement on any channel");

  - id: send_backlog            # resend stored packets on the working channel, newest last
    mode: single
    then:
      - lambda: 'id(bl_fail) = 0;'
      - while:
          condition:
            lambda: 'return id(backlog_n) > 0 && id(bl_fail) < 3;'
          then:
            - lambda: |-
                uint8_t i = id(backlog_n) - 1;
                std::copy(id(backlog).begin() + 64 * i, id(backlog).begin() + 64 * (i + 1), id(pkt).begin());
                id(pkt)[10] |= 0x02;  // backlog flag
                id(pkt_len) = 57;
                id(send_ok) = false;
            - espnow.send:
                address: ${receiver_mac}
                data: !lambda 'return std::vector<uint8_t>(id(pkt).begin(), id(pkt).begin() + id(pkt_len));'
                wait_for_sent: true
                continue_on_error: true
                on_sent:
                  - lambda: 'id(send_ok) = true;'
            - lambda: |-
                if (id(send_ok)) id(backlog_n) -= 1; else id(bl_fail) += 1;

  - id: store_backlog           # keep the newest 4 unsent packets
    mode: single
    then:
      - lambda: |-
          auto &b = id(backlog);
          if (id(backlog_n) >= 4) {
            std::copy(b.begin() + 64, b.end(), b.begin());   // drop the oldest
            id(backlog_n) = 3;
          }
          std::copy(id(pkt).begin(), id(pkt).end(), b.begin() + 64 * id(backlog_n));
          id(backlog_n) += 1;
          ESP_LOGW("snode", "stored for resend (%u waiting)", id(backlog_n));

  - id: shutdown
    mode: single
    then:
      - lambda: |-
          uint32_t now = id(rtc).read_epoch();
          uint32_t next;
          if (id(reply_ok)) {
            uint32_t ref = id(reply_now) + (millis() - id(reply_ms)) / 1000;
            if (!id(rtc).time_valid() || (now > ref ? now - ref : ref - now) > 2) id(rtc).write_epoch(ref);
            now = ref;
            next = id(reply_next);
          } else if (!id(rtc).time_valid()) {
            next = now + 3600;                        // no time yet: try again in 1 h
          } else {
            next = id(last_next);                     // keep the 12 h rhythm
            if (next == 0 || next > now + 13 * 3600) next = now + 12 * 3600;
            while (next < now + 120) next += 12 * 3600;
          }
          if (next < now + 120 || next > now + 13 * 3600) next = now + 12 * 3600;
          id(last_next) = next;
          id(rtc).set_alarm_epoch(next);             // also clears the alarm flag (INT released)
          global_preferences->sync();                // save seq, channel, backlog before power is cut
      - switch.turn_off: hold                        # power is cut here
      - delay: 3s
      - logger.log: "power still on: fallback deep sleep"
      - deep_sleep.enter: ds_fallback
